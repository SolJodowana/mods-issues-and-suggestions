name: Label mod
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Pole z dropdownu trafia do treści pod nagłówkiem "### Którego moda..."
            const m = context.payload.issue.body.match(/### Którego moda dotyczy zgłoszenie\?\s+(.+)/);
            if (m) await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [m[1].trim()]
            });
